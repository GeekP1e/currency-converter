<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конвертер валют</title>
<style>
:root{font:11px/1.3 system-ui,sans-serif;color:#17202a}*{box-sizing:border-box}body{margin:0;min-width:260px;background:#f6f8fb}main{padding:10px}header{display:flex;align-items:center;gap:7px;margin-bottom:10px}.logo{width:27px;height:27px;flex:0 0 auto}h1{margin:0;font-size:13px}header p{margin:1px 0 0;color:#68737d;font-size:9px}#theme{width:26px;height:26px;margin-left:auto;border:0;border-radius:7px;background:#e2f2ef;color:#196c62;font-size:15px;cursor:pointer}label{display:block;margin:0 0 3px;color:#56616c;font-size:9px;font-weight:650}input,select{width:100%;border:1px solid #d7dde3;border-radius:7px;background:white;color:#17202a;font:inherit;outline:none}input{padding:7px 8px;font-size:14px;font-weight:650}select{padding:6px 5px;font-size:10px}input:focus,select:focus{border-color:#1c8b7d;box-shadow:0 0 0 3px #1c8b7d20}.row{display:grid;grid-template-columns:1fr 28px 1fr;gap:5px;align-items:end;margin-top:8px}#swap{height:28px;border:0;border-radius:50%;background:#e2f2ef;color:#196c62;font-size:15px;cursor:pointer}.result{margin-top:9px;min-height:52px;padding:9px;border-radius:8px;background:#196c62;color:white}#result{display:block;overflow-wrap:anywhere;font-size:16px;font-weight:750}#rate{display:block;margin-top:3px;color:#d7f0ec;font-size:9px}.error{min-height:12px;margin:4px 0 0;color:#bd2c2c;font-size:9px}footer{display:flex;justify-content:space-between;align-items:center;color:#68737d;font-size:8px}#refresh{border:0;background:transparent;color:#196c62;cursor:pointer;font-size:9px;font-weight:650}body.dark{color:#e6edf4;background:#172027}body.dark input,body.dark select{border-color:#3e4c57;background:#222d36;color:#edf5fa}body.dark label{color:#b6c2cc}body.dark header p,body.dark footer{color:#98a8b5}body.dark #theme,body.dark #swap{background:#29443f;color:#7ed6c7}body.dark #refresh{color:#7ed6c7}
body{min-width:360px}</style></head><body><main><header><img class="logo" src="icon.svg" alt="Милый калькулятор"><div><h1>Конвертер валют</h1><p>Курс Нацбанка Казахстана</p></div><button id="theme" title="Сменить тему">☾</button></header><label for="amount">Сумма</label><input id="amount" inputmode="decimal" value="1" autocomplete="off"><section class="row"><div><label for="from">Из</label><select id="from"></select></div><button id="swap" title="Поменять валюты">⇄</button><div><label for="to">В</label><select id="to"></select></div></section><section class="result"><span id="result">—</span><small id="rate"></small></section><p id="error" class="error"></p><footer><span id="status">Загрузка курса…</span><button id="refresh">Обновить</button></footer></main>
<script src="popup.js"></script></body></html>
