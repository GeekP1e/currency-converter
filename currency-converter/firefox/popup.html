<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конвертер валют</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><img class="logo" src="icon.svg" alt="Милый калькулятор"><div><h1>Конвертер валют</h1><p>Курс Нацбанка Казахстана</p></div><button id="theme-toggle" type="button" aria-label="Сменить тему">☾</button></header>
<div id="converters"></div>
<button id="add" type="button" disabled>+ Добавить ещё</button>
<p id="error" class="error" role="alert"></p>
<footer><span id="status">Загрузка курса…</span><button id="refresh" type="button">Обновить</button></footer>
</main>
<template id="converter-template"><section class="converter">
<div class="card-header"><span class="card-title"></span><button class="remove" type="button" title="Удалить конвертер" aria-label="Удалить конвертер">×</button></div>
<label data-label="amount">Сумма</label><input data-field="amount" inputmode="decimal" autocomplete="off" value="1">
<div class="currency-row"><div><label data-label="from">Из</label><select data-field="from"></select></div><button class="swap" type="button" title="Поменять валюты местами" aria-label="Поменять валюты местами">⇄</button><div><label data-label="to">В</label><select data-field="to"></select></div></div>
<div class="result" aria-live="polite"><span data-field="result">—</span><small data-field="rate"></small></div><p data-field="error" class="error" role="alert"></p>
</section></template><script src="popup.js"></script></body></html>
