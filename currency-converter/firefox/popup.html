<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Конвертер валют</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icon.svg" alt="Милый калькулятор">
        <div><h1>Конвертер валют</h1><p>Курс Нацбанка Казахстана</p></div>
        <button id="theme-toggle" type="button" aria-label="Включить тёмную тему" title="Сменить тему">☾</button>
      </header>

      <label for="amount">Сумма</label>
      <input id="amount" inputmode="decimal" autocomplete="off" value="1" aria-describedby="error">

      <section class="currency-row">
        <div><label for="from">Из</label><select id="from"></select></div>
        <button id="swap" type="button" title="Поменять валюты местами" aria-label="Поменять валюты местами">⇄</button>
        <div><label for="to">В</label><select id="to"></select></div>
      </section>

      <section class="result" aria-live="polite">
        <span id="result">—</span>
        <small id="rate"></small>
      </section>

      <p id="error" class="error" role="alert"></p>
      <footer><span id="status">Загрузка курса…</span><button id="refresh" type="button">Обновить</button></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
